[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lib]
path = "lib.rs"
doctest = false

# Keep this crate out of any enclosing Cargo workspace.
[workspace]

[dependencies]
# Codec set deliberately matches avrocpp (null/deflate/snappy/zstd). bzip2
# and xz are intentionally NOT enabled: avrocpp does not support them, and
# they are the worst decompression-bomb formats. See container.rs and the
# README's "Untrusted input" section.
apache-avro = { version = "0.21", features = ["snappy", "zstandard"] }
serde_json = "1.0"
paste = "1.0"
md-5 = "0.10"
sha2 = "0.10"
uuid = "1"
# Generates the container writer's random sync marker (container.rs). Same
# version apache-avro already uses, so no new crate enters the flattened
# dependency list the Crubit build generates. (uuid's "v4" feature would
# pull a second getrandom major version, which that list cannot express.)
rand = "0.9"

[dev-dependencies]
tempfile = "3"
