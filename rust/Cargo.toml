[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lib]
path = "lib.rs"
doctest = false

# Keep this crate out of any enclosing Cargo workspace.
[workspace]

[dependencies]
# Codec set deliberately matches avrocpp (null/deflate/snappy/zstd). bzip2
# and xz are intentionally NOT enabled: avrocpp does not support them, and
# they are the worst decompression-bomb formats. See container.rs and the
# README's "Untrusted input" section.
apache-avro = { version = "0.21", features = ["snappy", "zstandard"] }
serde_json = "1.0"
paste = "1.0"
# Self-referential cell for the streaming OCF writer/reader, whose
# apache-avro Writer<'a, _>/Reader<'a, _> borrow an owned Schema. Proc-macro
# free; its internal unsafe is what lets this crate keep #![forbid(unsafe_code)].
# See StreamingDataFileWriter/StreamingDataFileReader in container.rs.
self_cell = "1"
md-5 = "0.10"
sha2 = "0.10"
uuid = "1"

[dev-dependencies]
tempfile = "3"
