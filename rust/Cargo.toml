[package]
name = "rust"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[lib]
path = "lib.rs"
doctest = false

# Keep this crate out of any enclosing Cargo workspace.
[workspace]

[dependencies]
# Codec set deliberately matches avrocpp (null/deflate/snappy/zstd). bzip2
# and xz are intentionally NOT enabled: avrocpp does not support them, and
# they are the worst decompression-bomb formats. See container.rs and the
# README's "Untrusted input" section.
# Local fork of 0.21.0; see third_party/apache-avro/PATCH.md. It adds two
# public entry points (schema::build_names, decode::decode_resolved) and
# changes nothing else. Upstream's public per-datum decode entry points all
# rebuild a ResolvedSchema per call, which for small records costs more than
# the decode itself, and the machinery to avoid it is pub(crate).
#
# Declared as a path dependency rather than [patch.crates-io] on purpose:
# Crubit's cpp_api_from_rust generates a synthetic -cc-api crate that is its
# own workspace root, so a patch section in this manifest would not reach it
# and the bindings build would silently resolve back to the registry crate.
# A path dependency is carried through into the generated manifest.
apache-avro = { path = "../third_party/apache-avro", features = ["snappy", "zstandard"] }
serde_json = "1.0"
paste = "1.0"
md-5 = "0.10"
sha2 = "0.10"
uuid = "1"
# Generates the container writer's random sync marker (container.rs). Same
# version apache-avro already uses, so no new crate enters the flattened
# dependency list the Crubit build generates. (uuid's "v4" feature would
# pull a second getrandom major version, which that list cannot express.)
rand = "0.9"

[dev-dependencies]
tempfile = "3"
